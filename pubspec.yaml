name: helply
description: "Helply AI Meeting Assistant - A Flutter implementation of the desktop app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_dotenv: ^5.2.1
  record: ^6.1.2
  permission_handler: ^12.0.1
  flutter_markdown: ^0.6.23
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_foreground_task: ^6.5.0
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
